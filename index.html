<script>

function changeImage(dot,id){

    const img = document.getElementById(id);
    const src = dot.dataset.img;

    img.src = src;

    const card = img.closest(".card");

    // remove active ring
    card.querySelectorAll(".dot")
        .forEach(d => d.classList.remove("active"));

    dot.classList.add("active");
}

function selectStorage(btn,price){

    const card = btn.closest(".card");

    card.querySelectorAll(".storage-btn")
        .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    const priceDiv = card.querySelector(".price");
    priceDiv.innerText = "₹" + price.toLocaleString();
}

</script>
